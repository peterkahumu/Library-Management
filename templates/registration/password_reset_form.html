{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<h1 class="row justify-content-center">Please enter your email</h1>
<div class="row justify-content-center mt-4">
    <div class="col-md-7 col-md-5">
        <form action="{% url 'password_reset' %}" method="post">
            {% csrf_token %}
            {{form|crispy}}
            <input type="submit" class="btn btn-success" value="Get Password Reset Instructions">
        </form>
    </div>
</div>

{% endblock content %}
