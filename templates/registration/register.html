{% extends 'base.html'%}
{% load crispy_forms_tags %}
{% block title %} Register {% endblock title %}

{% block content %}
<h1 class="row justify-content-center">Create an Account</h1>
<div class="row justify-content-center my-4">
    <div class="col-md-7 col-lg-5">
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100 mt-3">Create Account</button>
        </form>
        <p class="mt-3">Already have an account? <a href="{% url 'login' %}" class="link">Log in</a></p>
    </div>
</div>
{% endblock content %}
