{% load static %}
<!-- ============================================================
     Chatbot Widget — included in base.html, visible on all pages
     ============================================================ -->

<!-- Floating Action Button -->
<button id="chatbot-fab" aria-label="Open chat assistant" title="Chat with LibraBot">
    <i class="fas fa-comments"></i>
    <span class="chat-badge" aria-hidden="true"></span>
</button>

<!-- Chat Panel -->
<div id="chatbot-panel" role="dialog" aria-label="LibraBot chat assistant" aria-hidden="true"
    data-ai-service-url="{{ AI_SERVICE_URL }}/chat/stream/">

    <!-- Header -->
    <div class="chat-header">
        <div class="chat-avatar">
            <i class="fas fa-robot"></i>
        </div>
        <div class="chat-meta">
            <p class="chat-bot-name">LibraBot</p>
            <span class="chat-status">Online</span>
        </div>
        <button id="chatbot-close-btn" aria-label="Close chat">&times;</button>
    </div>

    <!-- Messages -->
    <div id="chatbot-messages" aria-live="polite" aria-relevant="additions">
        <!-- Messages appended here by JS -->
    </div>

    <!-- Quick Suggestion Chips -->
    <div id="chatbot-suggestions" class="chat-suggestions">
        <!-- Chips injected by JS -->
    </div>

    <!-- Input Row -->
    <div id="chatbot-input-row">
        <textarea id="chatbot-input" placeholder="Ask me anything…" rows="1" aria-label="Chat message input"
            autocomplete="off"></textarea>
        <button id="chatbot-send-btn" aria-label="Send message" disabled>
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>
