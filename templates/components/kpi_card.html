<div class="col-md-3">
    <div class="card border-0 shadow-sm h-100 border-start border-4 border-{{ color }}">
        <div class="card-body">
            <div class="d-flex align-items-center justify-content-between">
                <div>
                    <p class="text-muted small mb-1">{{ title }}</p>
                    <h3 class="fw-bold mb-0">{{ value }}</h3>
                </div>
                <div class="bg-{{ color }} bg-opacity-10 p-3 rounded-circle">
                    <i class="fas {{ icon }} text-{{ color }} fa-lg"></i>
                </div>
            </div>
        </div>
    </div>
</div>
