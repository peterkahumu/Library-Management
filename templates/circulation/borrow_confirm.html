{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="card-title mb-3">Confirm Borrowing</h3>
                <div class="d-flex align-items-center mb-4">
                    <img src="{{ book.cover_image.url }}" class="img-thumbnail me-3" style="width: 80px;">
                    <div>
                        <h5 class="mb-1">{{ book.title }}</h5>
                        <p class="text-muted mb-0">Format: {{ book.get_format_display }}</p>
                    </div>
                </div>

                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Confirm & Borrow</button>
                        <a href="{% url 'book_detail' book.pk %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
